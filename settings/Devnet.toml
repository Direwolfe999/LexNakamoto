[devnet]
# Disable heavy explorers to prioritize RAM for Node and API
disable_stacks_explorer = true
disable_bitcoin_explorer = true
disable_stacks_api = false

# Port configuration
orchestrator_port = 20445
postgres_port = 55432

# Speed up block times for local development (10 seconds)
bitcoin_controller_block_time = 10_000

# Linux note: forcing gateway routing can break bitcoin RPC on some hosts.
# Use Clarinet defaults unless you explicitly need host gateway routing.
# docker_host = "host-gateway"
# use_docker_gateway_routing = true

# Explicit Nakamoto/Clarity 2 compatible images
# Using quay.io images — compatible with CPUs without AVX2 (e.g. Sandy Bridge)
stacks_node_image_url = "quay.io/hirosystems/stacks-node:latest"
stacks_signer_image_url = "quay.io/hirosystems/stacks-signer:latest"
stacks_api_image_url = "hirosystems/stacks-blockchain-api:latest"

# --- EPOCH CONFIGURATION ---
# Let Clarinet compute valid epoch block heights automatically.
# Contracts deploy at epoch 3.0 (set in Clarinet.toml).
# ------------------------------------------
# Send some stacking orders
[[devnet.pox_stacking_orders]]
start_at_cycle = 1
duration = 10
auto_extend = true
wallet = "wallet_1"
slots = 2
btc_address = "mr1iPkD9N3RJZZxXRk7xF9d36gffa6exNC"

